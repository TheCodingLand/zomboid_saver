name: CI

on:
  push:
    branches:
      - master
      - "release/*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  tests:
    name: Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest

      - name: Generate coverage badge
        shell: pwsh
        run: |
          [xml]$doc = Get-Content coverage.xml
          $rate = [double]$doc.coverage."line-rate"
          $percent = [Math]::Round($rate * 100, 2)

          if ($percent -ge 90) {
            $color = "#4c1"
          }
          elseif ($percent -ge 80) {
            $color = "#97ca00"
          }
          elseif ($percent -ge 70) {
            $color = "#dfb317"
          }
          else {
            $color = "#e05d44"
          }

          $valueText = "$percent%"
          $svg = @(
            '<svg xmlns="http://www.w3.org/2000/svg" width="126" height="20" role="img" aria-label="coverage: {0}">' -f $valueText
            '  <title>coverage: {0}</title>' -f $valueText
            '  <linearGradient id="smooth" x2="0" y2="100%">'
            '    <stop offset="0" stop-color="#fff" stop-opacity=".7"/>'
            '    <stop offset="0.1" stop-color="#aaa" stop-opacity=".1"/>'
            '    <stop offset="0.9" stop-opacity=".3"/>'
            '    <stop offset="1" stop-opacity=".5"/>'
            '  </linearGradient>'
            '  <clipPath id="round">'
            '    <rect width="126" height="20" rx="3" fill="#fff"/>'
            '  </clipPath>'
            '  <g clip-path="url(#round)">'
            '    <rect width="63" height="20" fill="#555"/>'
            '    <rect x="63" width="63" height="20" fill="{0}"/>' -f $color
            '    <rect width="126" height="20" fill="url(#smooth)"/>'
            '  </g>'
            '  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">'
            '    <text x="32.5" y="15" fill="#010101" fill-opacity=".3">coverage</text>'
            '    <text x="32.5" y="14">coverage</text>'
            '    <text x="94.5" y="15" fill="#010101" fill-opacity=".3">{0}</text>' -f $valueText
            '    <text x="94.5" y="14">{0}</text>' -f $valueText
            '  </g>'
            '</svg>'
          ) -join "`n"

          Set-Content -Path coverage.svg -Value $svg -NoNewline

      - name: Extract coverage percentage
        id: coverage
        shell: pwsh
        run: |
          [xml]$doc = Get-Content coverage.xml
          $rate = [double]$doc.coverage."line-rate"
          $percent = [Math]::Round($rate * 100, 2)
          "value=$percent" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "### Coverage`n`n* Line coverage: **$percent%***" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Prepare badge publish directory
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path coverage-badge -Force | Out-Null
          Copy-Item coverage.svg coverage-badge/

      - name: Publish coverage badge to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: coverage-badge
          publish_branch: gh-pages
          keep_files: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.svg
